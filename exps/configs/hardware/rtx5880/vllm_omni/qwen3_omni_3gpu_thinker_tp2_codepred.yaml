# COUNTERFACTUAL of qwen3_omni_3gpu_thinker_tp2_async_c2wgraph.yaml (the stock 5880 recipe): the three code-predictor switches of vLLM-Omni's
# Qwen3-Omni path are on. Everything else is identical, so a difference is those switches. Used only through
#   --opt config.vllm-omni={variant:vllm_omni/qwen_codepred}   (experiment qwen-t2s-vllm-opt); never a baseline.
# The switches are read from the connector extra, the same place upstream's vllm_omni/deploy/qwen3_omni_moe_mrv2_h200.yaml sets them:
#   code_predictor_kv_cache        incremental K/V decoding of the residual code groups (CUDA only), instead of re-prefilling the growing sequence each step
#   code_predictor_short_kv        short-KV attention in that path (bf16, CUDA)
#   code_predictor_fused_sampling  fused sampling of the code predictor's codes
# Upstream's cuDNN algorithm search (codec_cudnn_benchmark) and the second-generation model runner (MRv2) are NOT here: see
# qwen3_omni_3gpu_thinker_tp2_mrv2_codepred.yaml for the variant with MRv2.
# RTX 5880 (3 cards, the fewest that fit): Thinker TP=2 on cards 0-1; Talker and Code2Wav share card 2.
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 25
      codec_left_context_frames: 25
      code_predictor_kv_cache: true
      code_predictor_short_kv: true
      code_predictor_fused_sampling: true

stages:
  - stage_id: 0
    max_num_batched_tokens: 8192
    max_num_seqs: 1
    max_model_len: 8192
    gpu_memory_utilization: 0.9
    moe_backend: triton
    trust_remote_code: true
    enable_prefix_caching: false
    tensor_parallel_size: 2
    devices: "0,1"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 128

  - stage_id: 1
    max_num_batched_tokens: 8192
    max_model_len: 8192
    max_num_seqs: 1
    gpu_memory_utilization: 0.6
    moe_backend: triton
    trust_remote_code: true
    enable_prefix_caching: false
    tensor_parallel_size: 1
    devices: "2"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      seed: 42
      temperature: 0.9
      top_k: 50
      max_tokens: 256
      repetition_penalty: 1.05

  - stage_id: 2
    max_num_batched_tokens: 16384
    max_model_len: 16384
    max_num_seqs: 1
    gpu_memory_utilization: 0.2
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    tensor_parallel_size: 1
    devices: "2"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 4096
      repetition_penalty: 1.1

platforms:
  cuda:
    stages:
      - stage_id: 0
        compilation_config:
          custom_ops: ["+rotary_embedding"]
