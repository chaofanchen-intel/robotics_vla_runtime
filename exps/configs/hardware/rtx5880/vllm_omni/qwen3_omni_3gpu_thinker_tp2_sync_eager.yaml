# RTX 5880 (3 cards): PLAIN recipe of qwen3_omni_3gpu_thinker_tp2_async_c2wgraph.yaml with the two settings the t2s-deploy-config ablation turns off
# (counterpart of qwen3_omni_full_1gpu.yaml): async_chunk: false and Code2Wav enforce_eager: true.
# RTX 5880 (3 cards, the fewest that fit): Thinker TP=2 on cards 0-1; Talker and Code2Wav share card 2.
# This retains the default async-chunk / Code2Wav graph behavior, but bounds
# single-request context and sequence counts for 48 GiB devices.
async_chunk: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 25
      codec_left_context_frames: 25

stages:
  - stage_id: 0
    max_num_batched_tokens: 8192
    max_num_seqs: 1
    max_model_len: 8192
    gpu_memory_utilization: 0.9
    moe_backend: triton
    trust_remote_code: true
    enable_prefix_caching: false
    tensor_parallel_size: 2
    devices: "0,1"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 128

  - stage_id: 1
    max_num_batched_tokens: 8192
    max_model_len: 8192
    max_num_seqs: 1
    gpu_memory_utilization: 0.6
    moe_backend: triton
    trust_remote_code: true
    enable_prefix_caching: false
    tensor_parallel_size: 1
    devices: "2"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      seed: 42
      temperature: 0.9
      top_k: 50
      max_tokens: 256
      repetition_penalty: 1.05

  - stage_id: 2
    max_num_batched_tokens: 16384
    max_model_len: 16384
    max_num_seqs: 1
    gpu_memory_utilization: 0.2
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    tensor_parallel_size: 1
    devices: "2"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 4096
      repetition_penalty: 1.1

platforms:
  cuda:
    stages:
      - stage_id: 0
        compilation_config:
          custom_ops: ["+rotary_embedding"]
