# COUNTERFACTUAL of qwen3_omni_3gpu_thinker_tp2_codepred.yaml: the same three code-predictor switches, and all three stages on vLLM-Omni's
# second-generation model runner (MRv2). Upstream's MRv2 profile (vllm_omni/deploy/qwen3_omni_moe_mrv2.yaml) replays the Talker's decode in FULL CUDA
# graphs together with the layers it captures for the Talker; the 5880 stock recipe runs the V1 runner. Used only through
#   --opt config.vllm-omni={variant:vllm_omni/qwen_mrv2_codepred}   (experiment qwen-t2s-vllm-opt); never a baseline.
# Stages 1 and 2 share card 2. Upstream says to run stages that share a GPU under NVIDIA MPS, and the server warns when no MPS server is found.
# Start the MPS control daemon on card 2 before running this arm, or the result is not comparable with the others.
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 25
      codec_left_context_frames: 25
      code_predictor_kv_cache: true
      code_predictor_short_kv: true
      code_predictor_fused_sampling: true

stages:
  - stage_id: 0
    model_runner: v2
    max_num_batched_tokens: 8192
    max_num_seqs: 1
    max_model_len: 8192
    gpu_memory_utilization: 0.9
    moe_backend: triton
    trust_remote_code: true
    enable_prefix_caching: false
    tensor_parallel_size: 2
    devices: "0,1"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 128

  - stage_id: 1
    model_runner: v2
    max_num_batched_tokens: 8192
    max_model_len: 8192
    max_num_seqs: 1
    gpu_memory_utilization: 0.6
    moe_backend: triton
    trust_remote_code: true
    enable_prefix_caching: false
    tensor_parallel_size: 1
    devices: "2"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      seed: 42
      temperature: 0.9
      top_k: 50
      max_tokens: 256
      repetition_penalty: 1.05

  - stage_id: 2
    model_runner: v2
    max_num_batched_tokens: 16384
    max_model_len: 16384
    max_num_seqs: 1
    gpu_memory_utilization: 0.2
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    tensor_parallel_size: 1
    devices: "2"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 4096
      repetition_penalty: 1.1

platforms:
  cuda:
    stages:
      - stage_id: 0
        compilation_config:
          custom_ops: ["+rotary_embedding"]
