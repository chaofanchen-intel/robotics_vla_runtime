# COUNTERFACTUAL, used only through `--opt config.mstar=...`: the TP=2 recipe with the Thinker's chunked-prefill budget raised from M*'s default 1,024 tokens to 4,096.
# nsys (qwen-prefill-nsys) showed the 1,072-token TXT prompt is cut 1,024 + 48 and the 48-token chunk costs a whole extra 48-layer forward (~40 ms, MoE weight-read bound).
# vLLM-Omni's Thinker uses max_num_batched_tokens 8192, so the prompt is one pass there. Not a baseline; see exps/results/mstar-advantage-attribution_rtx5880.md.
# Three-RTX-5880 deployment (the fewest cards that hold the model): Thinker TP=2 on ranks 0-1, Talker and Code2Wav
# together on rank 2. The 30B Thinker is ~61 GB in BF16 and needs two 48 GiB cards; keeping the Talker on its own card
# preserves the paper's "Thinker and Talker on separate devices" topology (2xH200 there).
# The 8k context and smaller Thinker KV pool leave room for graph workspaces on 48 GiB cards while retaining enough
# capacity for the smoke/profile cases.
model: "qwen3_omni"
max_seq_len: 8192
resources:
  thinker_kv:
    max_num_pages: 512
    cpu_offload_pages: 1024
node_groups:
  - node_names: [Thinker]
    ranks: [0, 1]
    tp_size: 2
  - node_names: [audio_encoder, vision_encoder]
    ranks: [0]
  - node_names: [Talker]
    ranks: [2]
  - node_names: [Code2Wav]
    ranks: [2]
max_batch_tokens:
  Thinker:
    thinker_mixed: 4096
