# COUNTERFACTUAL, used only through `--opt config.mstar=...`: qwen3omni_3gpu_thinker_tp2_chunk4096_bucket1152.yaml plus a 1,536 Thinker prefill graph bucket
# (qwen-prefill-len-dense). The 1,152 rung removed the 2,048-padding penalty at 1,072 tokens (TTFT 156 -> 113 ms) but also displaced the one 2,048 graph the
# default captures (bs=32). Does a second rung cover 1,153...1,536, and is it captured at all on a 48 GiB card? Check server.log for
# `Captured accelerator graph for Thinker: prefill_text[bs=1,tokens=1536]`. Only the ladder differs from the 1,152 config. Not a baseline.
# Three-RTX-5880 deployment (the fewest cards that hold the model): Thinker TP=2 on ranks 0-1, Talker and Code2Wav
# together on rank 2. The 30B Thinker is ~61 GB in BF16 and needs two 48 GiB cards; keeping the Talker on its own card
# preserves the paper's "Thinker and Talker on separate devices" topology (2xH200 there).
# The 8k context and smaller Thinker KV pool leave room for graph workspaces on 48 GiB cards while retaining enough
# capacity for the smoke/profile cases.
model: "qwen3_omni"
max_seq_len: 8192
resources:
  thinker_kv:
    max_num_pages: 512
    cpu_offload_pages: 1024
node_groups:
  - node_names: [Thinker]
    ranks: [0, 1]
    tp_size: 2
  - node_names: [audio_encoder, vision_encoder]
    ranks: [0]
  - node_names: [Talker]
    ranks: [2]
  - node_names: [Code2Wav]
    ranks: [2]
max_batch_tokens:
  Thinker:
    thinker_mixed: 4096
model_kwargs:
  prefill_token_buckets: [128, 256, 512, 1024, 1152, 1536, 2048]
