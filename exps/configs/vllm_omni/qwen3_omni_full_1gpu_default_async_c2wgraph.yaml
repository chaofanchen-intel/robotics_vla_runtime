# qwen3_omni_full_1gpu_default_async.yaml with ONE change: stage 2 (Code2Wav) enforce_eager: false, which is upstream's setting
# (vllm_omni/deploy/qwen3_omni_moe.yaml: "stage 2 keeps enforce_eager=false so Code2Wav can use its inner cudagraph on CUDA").
# The local single-GPU yamls set it to true. Together with async_chunk: true (upstream default) this is the closest single-GPU
# equivalent of the official Qwen3-Omni profile. A server that cannot start (stage 2 owns only 0.10 of the card) is a result, not a retry.
# qwen3_omni_full_1gpu.yaml with ONE change: async_chunk: true (upstream's default). Same default Talker sampling
# (temperature 0.9, top_k 50, repetition_penalty 1.05), so the sync/async pair differs in nothing else.
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 25
      codec_left_context_frames: 25

stages:
  - stage_id: 0
    max_num_batched_tokens: 8192
    max_num_seqs: 1
    max_model_len: 8192
    gpu_memory_utilization: 0.65
    moe_backend: triton
    trust_remote_code: true
    enable_prefix_caching: false
    tensor_parallel_size: 1
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 128

  - stage_id: 1
    max_num_batched_tokens: 4096
    max_num_seqs: 1
    gpu_memory_utilization: 0.20
    moe_backend: triton
    trust_remote_code: true
    enable_prefix_caching: false
    tensor_parallel_size: 1
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      seed: 42
      temperature: 0.9
      top_k: 50
      max_tokens: 256
      repetition_penalty: 1.05

  - stage_id: 2
    max_num_batched_tokens: 4096
    max_num_seqs: 1
    gpu_memory_utilization: 0.10
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    tensor_parallel_size: 1
    devices: "0"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 4096
      repetition_penalty: 1.1