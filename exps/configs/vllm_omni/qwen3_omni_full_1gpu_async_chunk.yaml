# Single-H200 async-chunk performance candidate for Qwen3-Omni T2S.
# Identical to qwen3_omni_full_1gpu_greedy.yaml except that downstream stages
# may receive and process payload chunks before the upstream stage finishes.
# This is a candidate to measure, not a claim that E2E will improve.
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 25
      codec_left_context_frames: 25

stages:
  - stage_id: 0
    max_num_batched_tokens: 8192
    max_num_seqs: 1
    max_model_len: 8192
    gpu_memory_utilization: 0.65
    moe_backend: triton
    trust_remote_code: true
    enable_prefix_caching: false
    tensor_parallel_size: 1
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 128

  - stage_id: 1
    max_num_batched_tokens: 4096
    max_num_seqs: 1
    gpu_memory_utilization: 0.20
    moe_backend: triton
    trust_remote_code: true
    enable_prefix_caching: false
    tensor_parallel_size: 1
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      seed: 42
      temperature: 0.0
      top_p: 1.0
      top_k: 1
      max_tokens: 256
      repetition_penalty: 1.0

  - stage_id: 2
    max_num_batched_tokens: 4096
    max_num_seqs: 1
    gpu_memory_utilization: 0.10
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    tensor_parallel_size: 1
    devices: "0"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 4096
      repetition_penalty: 1.1
