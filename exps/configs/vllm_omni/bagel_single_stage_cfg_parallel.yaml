# BAGEL-7B-MoT single-stage with CFG parallelism over THREE GPUs (the paper's 3-GPU setting for vLLM-Omni: its CFG-parallel plugin, one rank
# per guidance branch; Bagel supports cfg_parallel_size=3). Counterpart of bagel_single_stage.yaml; used by `--opt bagel.topology=cfg-parallel`.
pipeline: bagel_single_stage
async_chunk: false

stages:
  - stage_id: 0
    max_num_batched_tokens: 32768
    max_num_seqs: 1
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "0,1,2"
    cfg_parallel_size: 3
    default_sampling_params:
      seed: 52
