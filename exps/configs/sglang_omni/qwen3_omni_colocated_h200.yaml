# SPDX-License-Identifier: Apache-2.0
#
# Example single-H200 colocated Qwen3-Omni launcher config.
# The Python pipeline config owns the stage topology; this file only sets the
# per-stage memory budgets needed for colocated launch.
#
# This profile keeps about 6% of device memory outside stage budgets for CUDA
# graph capture, backend workspaces, activation peaks, and allocator
# fragmentation.

config_cls: Qwen3OmniSpeechColocatedPipelineConfig
name: qwen3-omni-colocated-h200
model_path: Qwen/Qwen3-Omni-30B-A3B-Instruct

stages:
  image_encoder:
    gpu_memory_fraction: 0.017
  audio_encoder:
    gpu_memory_fraction: 0.017
  thinker:
    gpu_memory_fraction: 0.769
  talker_ar:
    gpu_memory_fraction: 0.123
    engine:
      moe_runner_backend: triton
      # The first H200 Talker warmup otherwise launches a long FlashInfer JIT
      # autotune before the colocated service can bind its API port.
      disable_flashinfer_autotune: true
  code2wav:
    gpu_memory_fraction: 0.014
